name: Build Check
on:
  push:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6.0.1

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - uses: joerdav/setup-xc@v1
        with:
          id: install

      - name: build zola and tailwind
        run: |
          xc install
          xc build
