{% extends "base.html" %}

{% block content %}
<main role="main" class="border p-3.5 font-light text-slate-900 border-slate-900 gap-3 flex flex-col">
    <h1 class="text-3xl">
        {{ page.title }}
    </h1>
    {{ page.content | safe }}
</main>

<div class="grid grid-cols-1 w-full gap-5" >
    {% for image in page.extra.images %}
    <img src="{{ image }}" class="w-full" />
    {% endfor %}
</div>

{% block article_body %} {% endblock article_body %}
{% endblock content %}
