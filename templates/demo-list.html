{% extends "section.html" %}

{% block section_body %}
{% for page in section.pages %}
<a href="{{ page.permalink | safe}}">
<div class="border hover:bg-slate-100 active:bg-slate-300 p-3.5 font-light text-slate-900 border-slate-900 gap-3 flex flex-col">
    <h1 class="text-3xl">{{ page.title }}</h1>
    <p>{{ page.description }}</p>
</div></a>
{% endfor %}
{% endblock section_body %}

{% block article_body %}
{{ super() }}
{% endblock article_body %}
